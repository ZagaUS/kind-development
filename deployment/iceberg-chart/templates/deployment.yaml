apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-rest
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-rest
    spec:
      containers:
        - name: iceberg-rest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
