apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: dataproduct
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      volumes:
        - name: minio-storage
          emptyDir: {}  # Use PVC in production
      containers:
        - name: minio
          image: quay.io/osclimate/minio:latest
          args:
            - server
            - /data
            - '--console-address=:9001'
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          env:
            - name: MINIO_ROOT_USER
              value: "minioAdmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minio1234"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console

        - name: mc-sidecar
          image: quay.io/minio/mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for MinIO to be ready...";
              until mc alias set local http://localhost:9000 minioAdmin minio1234; do sleep 2; done
              echo "Creating bucket...";
              mc mb local/my-default-bucket || true
              echo "Bucket ensured.";
              tail -f /dev/null  # Keep container alive
          env:
            - name: MINIO_ROOT_USER
              value: "minioAdmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minio1234"
          volumeMounts:
            - name: minio-storage
              mountPath: /data
