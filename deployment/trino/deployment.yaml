apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
        - name: trino
          image: trinodb/trino:latest
          command: ["/usr/lib/trino/bin/launcher"]
          args: ["run", "--etc-dir", "/etc/trino"]
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/trino
            - name: data-volume
              mountPath: /var/trino
            - name: catalog-volume
              mountPath: /etc/trino/catalog
            - name: trino-var-volume
              mountPath: /usr/lib/trino/var
      volumes:
        - name: config-volume
          configMap:
            name: trino-config
        - name: data-volume
          emptyDir: {}
        - name: catalog-volume
          configMap:
            name: trino-catalog
        - name: trino-var-volume
          emptyDir: {}
