# -----------------------------------------
# PostgreSQL Deployment
# -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dataproduct
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 26  # Required for OpenShift file permissions
      containers:
        - name: postgres
          image: registry.redhat.io/rhel8/postgresql-13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: iceberg_user
            - name: POSTGRESQL_PASSWORD
              value: iceberg_pass
            - name: POSTGRESQL_DATABASE
              value: iceberg_metadata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}  # ✅ Use PVC in production
---
# -----------------------------------------
# PostgreSQL ClusterIP Service
# -----------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dataproduct
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  type: ClusterIP  # Default; internal access only
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
